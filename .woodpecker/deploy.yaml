# Deploy memorygrain.org to production: the CloudPe areev-prod cluster, namespace
# `memorygrain-web` (since 2026-11-03; Odin before, Atlas before that).
#
# Trigger: push to deploy/prod (deploy/odin no longer deploys).
# Kubeconfig: repository secret cloudpe_kubeconfig_sites_deployer, the
# `sites-deployer` service account (devops cloudpe-cluster/areev-prod/18-sites.sh).
#
# The deployment pins image tag `latest` with imagePullPolicy: Always, so a
# rollout restart is required after the push — set-image alone is a no-op when
# the tag has not changed.

when:
  - event: manual
  - event: push
    branch: deploy/prod

labels:
  location: office

steps:
  - name: slack-start
    image: registry.mindgryd.com/mindgryd/wp-notify
    failure: ignore
    commands:
      - notify started
    environment:
      SLACK_BOT_TOKEN:
        from_secret: slack_bot_token

  - name: build
    image: docker:27
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    commands:
      - docker login registry.mindgryd.com -u $HARBOR_USERNAME -p $HARBOR_PASSWORD
      - >-
        docker build
        --build-arg NEXT_PUBLIC_GA_ID=G-VW8SRXQEW3
        --build-arg NEXT_PUBLIC_SITE_URL=https://memorygrain.org
        -t registry.mindgryd.com/opensource/memorygrain-web:latest
        -t registry.mindgryd.com/opensource/memorygrain-web:${CI_PIPELINE_NUMBER}
        .
      - docker push registry.mindgryd.com/opensource/memorygrain-web:latest
      - docker push registry.mindgryd.com/opensource/memorygrain-web:${CI_PIPELINE_NUMBER}
    environment:
      HARBOR_USERNAME:
        from_secret: harbor_username
      HARBOR_PASSWORD:
        from_secret: harbor_password

  - name: clone-devops
    image: python:3.12-alpine
    commands:
      - apk add --no-cache git
      - pip install --quiet PyJWT cryptography requests
      - |
        python3 -c "
        import jwt, time, requests, subprocess, sys, os

        app_id = os.environ['GH_APP_ID'].strip()
        key = os.environ['GH_APP_PRIVATE_KEY']
        install_id = os.environ['GH_APP_INSTALLATION_ID_DEVOPS'].strip()

        now = int(time.time())
        encoded = jwt.encode({'iat': now - 60, 'exp': now + 600, 'iss': app_id}, key, algorithm='RS256')

        r = requests.post(
            f'https://api.github.com/app/installations/{install_id}/access_tokens',
            headers={'Authorization': f'Bearer {encoded}', 'Accept': 'application/vnd.github+json'})
        if r.status_code != 201:
            print(f'ERROR: GitHub API {r.status_code}: {r.json().get(\"message\", \"unknown\")}'); sys.exit(1)
        token = r.json()['token']

        if subprocess.run(['git', 'clone', '--depth=1',
            f'https://x-access-token:{token}@github.com/mindgryd/devops.git', '.devops']).returncode != 0:
            print('ERROR: devops clone failed'); sys.exit(1)
        print('devops cloned')
        "
    environment:
      GH_APP_ID:
        from_secret: gh_app_id
      GH_APP_PRIVATE_KEY:
        from_secret: gh_app_private_key
      GH_APP_INSTALLATION_ID_DEVOPS:
        from_secret: gh_app_installation_id_devops

  - name: deploy
    # Bitnami's `latest` by digest, as devops' agent-tools-deploy pins it. HOME is set because the
    # image runs as UID 1001 with no HOME, and the agent's netrc injection fails writing "//.netrc".
    # Applying the overlay also restores the base's 1 replica if the site was scaled to 0.
    image: bitnami/kubectl@sha256:b29d8c1665b70817259ceecaea16ab27aab6368b48daf485d19436c809067492
    commands:
      - printf '%s\n' "$KUBECONFIG_DATA" > /tmp/kubeconfig
      - kubectl apply -k .devops/services/memorygrain-web/overlays/cloudpe
      - kubectl rollout restart deployment/memorygrain-web -n memorygrain-web
      - kubectl rollout status deployment/memorygrain-web -n memorygrain-web --timeout=300s
      - kubectl get pods,ingress,certificate -n memorygrain-web
    environment:
      HOME: /tmp
      KUBECONFIG: /tmp/kubeconfig
      KUBECONFIG_DATA:
        from_secret: cloudpe_kubeconfig_sites_deployer

  - name: slack-success
    image: registry.mindgryd.com/mindgryd/wp-notify
    failure: ignore
    commands:
      - notify success
    environment:
      SLACK_BOT_TOKEN:
        from_secret: slack_bot_token

  - name: slack-failure
    image: registry.mindgryd.com/mindgryd/wp-notify
    failure: ignore
    when:
      - status: [failure]
    commands:
      - notify failure
    environment:
      SLACK_BOT_TOKEN:
        from_secret: slack_bot_token
